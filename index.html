<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典怀旧游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 40px; }
        .icon { font-size: 100px; margin-bottom: 30px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { color: #f8fafc; font-size: 32px; margin-bottom: 15px; }
        p { color: #94a3b8; font-size: 18px; margin-bottom: 40px; }
        .btn { 
            display: inline-block; 
            padding: 18px 40px; 
            border-radius: 16px; 
            font-size: 18px; 
            font-weight: 600; 
            text-decoration: none;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn-play { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            color: white; 
            box-shadow: 0 10px 40px rgba(99,102,241,0.4);
        }
        .btn-download { 
            background: rgba(255,255,255,0.1); 
            color: #f8fafc; 
            border: 2px solid rgba(255,255,255,0.2);
        }
        .btn:hover { transform: translateY(-3px); }
        .games { color: #64748b; font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎮</div>
        <h1>经典怀旧游戏</h1>
        <p>FC/NES 经典游戏合集 · 触屏操作</p>
        
        <a href="./app/" class="btn btn-play">🚀 开始游戏</a>
        <a href="./app/download-apk.html" class="btn btn-download">📦 下载 APK</a>
        
        <div class="games">
            超级玛丽 · 魂斗罗 · 忍者龙剑传 · 赤色要塞 · 双截龙 · 坦克大战 · 冒险岛 等 20+ 款经典游戏
        </div>
    </div>
</body>
</html>
