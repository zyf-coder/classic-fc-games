<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="email=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="full-screen" content="yes">
    <meta name="browsermode" content="application">
    <meta name="x5-orientation" content="landscape">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <meta name="screen-orientation" content="landscape">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>经典怀旧游戏</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link href="css/mobile.css" rel="stylesheet" type="text/css">
</head>
<body>
    <audio id="mainBgm" src="cf.mp4" loop preload="auto"></audio>

<!-- 联机对话框 -->
<div id="onlineDialog" class="online-dialog">
    <div class="online-dialog-content">
        <div class="online-dialog-header">
            <h2>联机对战</h2>
            <button class="online-dialog-close" id="onlineDialogClose">×</button>
        </div>
        
        <div class="online-tabs">
            <button class="online-tab active" data-tab="create">创建房间</button>
            <button class="online-tab" data-tab="join">加入房间</button>
        </div>
        
        <div id="createRoomPanel" class="online-panel active">
            <div class="online-form-group">
                <label>你的昵称</label>
                <input type="text" id="playerNameCreate" placeholder="输入昵称" maxlength="10">
            </div>
            <div class="online-form-group">
                <label>选择游戏</label>
                <select id="gameSelectOnline"></select>
            </div>
            <button class="online-btn online-btn-primary" id="createRoomBtn">创建房间</button>
        </div>
        
        <div id="joinRoomPanel" class="online-panel">
            <div class="online-form-group">
                <label>你的昵称</label>
                <input type="text" id="playerNameJoin" placeholder="输入昵称" maxlength="10">
            </div>
            <div class="online-form-group">
                <label>房间号</label>
                <input type="text" id="roomIdInput" placeholder="输入6位房间号" maxlength="6" style="text-transform: uppercase;">
            </div>
            <button class="online-btn online-btn-primary" id="joinRoomBtn">加入房间</button>
        </div>
        
        <div id="waitingPanel" class="online-panel">
            <div class="waiting-info">
                <div class="waiting-icon">🎮</div>
                <div class="waiting-text">等待玩家加入...</div>
                <div class="waiting-room-id">房间号: <span id="waitingRoomId"></span></div>
            </div>
            <button class="online-btn online-btn-secondary" id="copyRoomIdBtn">复制房间号</button>
            <button class="online-btn online-btn-danger" id="cancelWaitingBtn">取消</button>
        </div>
        
        <div id="connectedPanel" class="online-panel">
            <div class="connected-info">
                <div class="connected-icon">✅</div>
                <div class="connected-text">玩家已加入！</div>
                <div class="connected-players">
                    <span id="player1Name">玩家1</span> VS <span id="player2Name">玩家2</span>
                </div>
            </div>
            <button class="online-btn online-btn-primary" id="startOnlineGameBtn">开始游戏</button>
            <button class="online-btn online-btn-danger" id="leaveRoomBtn">离开房间</button>
        </div>
    </div>
</div>

<!-- 联机状态栏 -->
<div id="onlineStatusBar" class="online-status-bar" style="display: none;">
    <div class="online-status-info">
        <span class="online-badge">联机中</span>
        <span id="onlineOpponentName">对手</span>
    </div>
    <button class="online-disconnect-btn" id="onlineDisconnectBtn">断开</button>
</div>

    <!-- 游戏选择页面 -->
    <div id="gameSelectPage" class="page active">
        <div class="update-banner" id="updateBanner" role="status" aria-live="polite">
            <div><strong>发现新版本 <span id="updateVersion"></span></strong><small id="updateNotes">更新后获得最新功能和修复</small></div>
            <a href="../classic-fc-games.apk" class="update-action" download>立即更新</a>
            <button class="update-dismiss" id="updateDismiss" aria-label="关闭">×</button>
        </div>
        <div class="game-select-container">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">🎮</div>
                    <div class="logo-text">
                        <h1>经典怀旧游戏</h1>
                        <p>FC/NES 经典合集</p>
                    </div>
                </div>
            </div>
            <div class="game-grid" id="gameGrid">
                <!-- 游戏卡片将通过JS动态生成 -->
            </div>
            <div class="footer">
            </div>
            <div class="online-entry">
                <button class="online-entry-btn" id="onlineEntryBtn">
                    <span class="online-entry-icon">🌐</span>
                    <span class="online-entry-text">联机对战</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 游戏页面 -->
    <div id="gamePage" class="page">
        <!-- 顶部菜单栏 -->
        <div class="game-header" id="gameHeader">
            <button class="header-btn back-btn" id="backBtn">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </button>
            <div class="game-title" id="gameTitle">游戏名称</div>
            <div class="header-right">
                <button class="header-btn" id="settingsBtn" aria-label="操作设置">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65-2-3.46-2.49 1a7.4 7.4 0 0 0-1.69-.98L15 3h-4l-.37 2.93c-.6.25-1.17.58-1.69.98l-2.49-1-2 3.46 2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65 2 3.46 2.49-1c.52.4 1.09.73 1.69.98L11 21h4l.37-2.93c.6-.25 1.17-.58 1.69-.98l2.49 1 2-3.46-2.12-1.65zM13 15.5A3.5 3.5 0 1 1 13 8a3.5 3.5 0 0 1 0 7.5z" fill="currentColor"/></svg>
                </button>
                <button class="header-btn" id="soundBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
                </button>
                <button class="header-btn" id="pauseBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel" aria-hidden="true">
            <div class="settings-title">操作设置</div>
            <label class="settings-range" for="screenMarginRange">
                <span>左右控件边距</span>
                <output id="screenMarginValue">44px</output>
            </label>
            <input id="screenMarginRange" type="range" min="20" max="100" step="1" value="44">
            <button class="settings-close" id="settingsClose">完成</button>
        </div>

        <!-- 游戏屏幕 -->
        <div class="game-screen-container">
            <div id="emulator" class="emulator"></div>
        </div>

        <!-- 左侧虚拟摇杆 -->
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-base" id="joystickBase">
                <div class="joystick-stick" id="joystickStick"></div>
                <div class="joystick-direction">
                    <span class="dir-up">▲</span>
                    <span class="dir-right">▶</span>
                    <span class="dir-down">▼</span>
                    <span class="dir-left">◀</span>
                </div>
            </div>
        </div>

        <!-- 右侧操作按钮 -->
        <div class="action-area" id="actionArea">
            <button class="action-btn btn-b" id="btnB">
                <span>B</span>
            </button>
            <button class="action-btn btn-a" id="btnA">
                <span>A</span>
            </button>
        </div>

        <div class="system-btns">
            <button class="system-btn" id="btnSelect"><span>选择</span></button>
            <button class="system-btn" id="btnStart"><span>开始</span></button>
        </div>

        <!-- 暂停菜单 -->
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-menu">
                <h2>游戏暂停</h2>
                <button class="menu-btn" id="resumeBtn">继续游戏</button>
                <button class="menu-btn" id="restartBtn">重新开始</button>
                <button class="menu-btn" id="exitBtn">退出游戏</button>
            </div>
        </div>
    </div>

    <script src="js/jquery-1.4.2.min.js" type="text/javascript"></script>
    <script src="js/dynamicaudio-min.js" type="text/javascript"></script>
    <script src="js/nes.js" type="text/javascript"></script>
    <script src="js/utils.js" type="text/javascript"></script>
    <script src="js/cpu.js" type="text/javascript"></script>
    <script src="js/keyboard.js" type="text/javascript"></script>
    <script src="js/mappers.js" type="text/javascript"></script>
    <script src="js/papu.js" type="text/javascript"></script>
    <script src="js/ppu.js" type="text/javascript"></script>
    <script src="js/rom.js" type="text/javascript"></script>
    <script src="js/ui.js" type="text/javascript"></script>
<script src="js/supabase-multiplayer.js"></script>
    <script src="js/mobile-touch.js" type="text/javascript"></script>
    <script src="js/mobile-app.js" type="text/javascript"></script>
    <script>
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('SW 注册成功:', registration.scope);
                    })
                    .catch(err => {
                        console.log('SW 注册失败:', err);
                    });
            });
        }
    </script>
</body>
</html>
