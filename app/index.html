<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="full-screen" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">
    <title>经典怀旧游戏</title>
    <link rel="manifest" href="manifest.json">
    <link href="css/mobile.css" rel="stylesheet" type="text/css">
</head>
<body>
    <audio id="mainBgm" src="cf.mp4" loop preload="auto"></audio>

    <!-- 昵称设置弹窗 -->
    <div id="nicknameDialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title">设置昵称</div>
            <div class="dialog-form">
                <label>输入你的游戏昵称（唯一）</label>
                <input type="text" id="nicknameInput" placeholder="请输入昵称" maxlength="10">
                <div id="nicknameStatus" class="nickname-status"></div>
            </div>
            <div class="dialog-actions">
                <button class="dialog-btn dialog-btn-cancel" id="nicknameCancelBtn">取消</button>
                <button class="dialog-btn dialog-btn-confirm" id="confirmNicknameBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- 联机大厅页面 -->
    <div id="onlineLobbyPage" class="page">
        <div class="lobby-container">
            <div class="lobby-header">
                <button class="lobby-back-btn" id="lobbyBackBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
                </button>
                <h2>游戏房间</h2>
                <div class="lobby-nickname" id="lobbyNickname"></div>
            </div>
            
            <div class="online-tabs">
                <button class="online-tab active" data-tab="roomList">房间列表</button>
                <button class="online-tab" data-tab="createRoom">创建房间</button>
                <button class="online-tab" data-tab="joinRoom">输入房间号</button>
            </div>
            
            <div id="roomListPanel" class="online-panel active">
                <div class="room-list" id="roomList">
                    <div class="room-list-empty">暂无房间，快去创建吧</div>
                </div>
                <button class="online-btn online-btn-secondary" id="refreshRoomListBtn">刷新列表</button>
            </div>
            
            <div id="createRoomPanel" class="online-panel">
                <div class="online-form-group">
                    <label>选择游戏</label>
                    <select id="gameSelectOnline"></select>
                </div>
                <button class="online-btn online-btn-primary" id="createRoomBtn">创建房间</button>
            </div>
            
            <div id="joinRoomPanel" class="online-panel">
                <div class="online-form-group">
                    <label>房间号</label>
                    <input type="text" id="roomIdInput" placeholder="输入6位房间号" maxlength="6" style="text-transform: uppercase;">
                </div>
                <button class="online-btn online-btn-primary" id="joinRoomBtn">加入房间</button>
            </div>
        </div>
    </div>

    <!-- 房间页面 -->
    <div id="roomPage" class="page">
        <div class="room-container">
            <div class="room-header">
                <button class="room-back-btn" id="roomBackBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
                </button>
                <div class="room-info">
                    <div class="room-id-display">房间号: <span id="roomIdDisplay"></span></div>
                </div>
                <button class="room-copy-btn" id="roomCopyBtn">复制</button>
            </div>
            
            <div class="room-players">
                <div class="room-player player1">
                    <div class="player-avatar">🎮</div>
                    <div class="player-name" id="roomPlayer1">等待中...</div>
                </div>
                <div class="room-vs">VS</div>
                <div class="room-player player2">
                    <div class="player-avatar">🎮</div>
                    <div class="player-name" id="roomPlayer2">等待中...</div>
                </div>
            </div>
            
            <div class="room-chat">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-system">欢迎来到房间</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="输入消息..." maxlength="100">
                    <button id="chatSendBtn">发送</button>
                </div>
            </div>
            
            <div class="room-actions">
                <button class="online-btn online-btn-primary" id="startGameBtn" disabled>等待对手加入...</button>
            </div>
        </div>
    </div>

    <!-- 我的页面 -->
    <div id="profilePage" class="page">
        <div class="profile-container">
            <div class="profile-header">
                <h2>我的</h2>
            </div>
            <div class="profile-content">
                <div class="profile-item">
                    <span class="profile-label">昵称</span>
                    <span class="profile-value" id="profileNickname">未设置</span>
                </div>
                <div class="profile-item">
                    <span class="profile-label">版本</span>
                    <span class="profile-value">1.7.2</span>
                </div>
                <button class="online-btn online-btn-secondary" id="changeNicknameBtn">修改昵称</button>
                <button class="online-btn online-btn-primary" id="aboutBtn" style="margin-top:12px;">关于我们</button>
            </div>
        </div>
    </div>

    <!-- 游戏选择页面 -->
    <div id="gameSelectPage" class="page active">
        <div class="game-select-container">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">🎮</div>
                    <div class="logo-text">
                        <h1>经典怀旧游戏</h1>
                        <p>FC/NES 经典合集</p>
                    </div>
                </div>
            </div>
            <div class="game-grid" id="gameGrid"></div>
        </div>
    </div>

    <!-- 游戏页面 -->
    <div id="gamePage" class="page">
        <div class="game-header" id="gameHeader">
            <button class="header-btn back-btn" id="backBtn">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </button>
            <div class="game-title" id="gameTitle">游戏名称</div>
            <div class="header-right">
                <button class="header-btn" id="soundBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
                </button>
                <button class="header-btn" id="pauseBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>

        <div class="game-screen-container">
            <div id="emulator" class="emulator"></div>
        </div>

        <!-- 方向按键 -->
        <div class="dpad-area" id="dpadArea">
            <button class="dpad-btn dpad-up" id="dpadUp">▲</button>
            <button class="dpad-btn dpad-right" id="dpadRight">▶</button>
            <button class="dpad-btn dpad-down" id="dpadDown">▼</button>
            <button class="dpad-btn dpad-left" id="dpadLeft">◀</button>
        </div>

        <!-- 右侧操作区 -->
        <div class="right-controls">
            <div class="system-btns">
                <button class="system-btn" id="btnSelect"><span>选择</span></button>
                <button class="system-btn" id="btnStart"><span>开始</span></button>
            </div>
            <div class="action-area" id="actionArea">
                <button class="action-btn btn-b" id="btnB"><span>B</span></button>
                <button class="action-btn btn-a" id="btnA"><span>A</span></button>
            </div>
        </div>

        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-menu">
                <h2>游戏暂停</h2>
                <button class="menu-btn" id="resumeBtn">继续游戏</button>
                <button class="menu-btn" id="restartBtn">重新开始</button>
                <button class="menu-btn" id="exitBtn">退出游戏</button>
            </div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="bottom-tabs" id="bottomTabs">
        <button class="tab-item active" data-page="gameSelectPage">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8zM6 15h2v-2h2v-2H8V9H6v2H4v2h2v2zm9.5-2c.83 0 1.5-.67 1.5-1.5S16.33 10 15.5 10s-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm3-3c.83 0 1.5-.67 1.5-1.5S19.33 7 18.5 7 17 7.67 17 8.5 7.67 10 8.5 10z" fill="currentColor"/></svg>
            <span>游戏</span>
        </button>
        <button class="tab-item" data-page="onlineLobbyPage">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/></svg>
            <span>游戏房间</span>
        </button>
        <button class="tab-item" data-page="profilePage">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
            <span>我的</span>
        </button>
    </div>

    <script src="js/jquery-1.4.2.min.js"></script>
    <script src="js/dynamicaudio-min.js"></script>
    <script src="js/nes.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cpu.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/mappers.js"></script>
    <script src="js/papu.js"></script>
    <script src="js/ppu.js"></script>
    <script src="js/rom.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/supabase-multiplayer.js"></script>
    <script src="js/mobile-touch.js"></script>
    <script src="js/mobile-app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW注册成功'))
                    .catch(err => console.log('SW注册失败'));
            });
        }
    </script>
</body>
</html>
